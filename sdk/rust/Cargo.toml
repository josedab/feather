[package]
name = "feather-client"
version = "0.1.0"
edition = "2021"
description = "Rust client for Feather Feature Store"
license = "Apache-2.0"
repository = "https://github.com/feather-store/feather"
documentation = "https://docs.rs/feather-client"
keywords = ["feather", "feature-store", "ml", "machine-learning"]
categories = ["api-bindings", "science"]
readme = "README.md"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.5"
futures = "0.3"

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
