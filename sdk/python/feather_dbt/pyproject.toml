[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feather-dbt"
version = "1.0.0"
description = "dbt integration for Feather Feature Store"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Feather Team", email = "team@feather.dev" }
]
keywords = ["feature-store", "dbt", "mlops", "data-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
feather-dbt = "feather_dbt.cli:main"

[project.urls]
Homepage = "https://github.com/feather-store/feather"
Documentation = "https://feather.dev/docs/integrations/dbt"
Repository = "https://github.com/feather-store/feather"

[tool.hatch.build.targets.wheel]
packages = ["feather_dbt"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
