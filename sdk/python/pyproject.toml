[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feather-client"
version = "1.0.0"
description = "Python SDK for Feather Feature Store"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "Feather Team", email = "team@feather.dev" }
]
keywords = ["feature-store", "ml", "machine-learning", "mlops", "vectors"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0.0"]
polars = ["polars>=0.19.0"]
numpy = ["numpy>=1.24.0"]
all = [
    "pandas>=2.0.0",
    "polars>=0.19.0",
    "numpy>=1.24.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/feather-store/feather"
Documentation = "https://feather.dev/docs/python-sdk"
Repository = "https://github.com/feather-store/feather"

[tool.hatch.build.targets.wheel]
packages = ["feather_client"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
