version: '3.8'

services:
  feather:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"   # HTTP serving
      - "50051:50051" # gRPC serving
      - "8081:8081"   # HTTP ingestion
      - "9090:9090"   # Prometheus metrics
    volumes:
      - feather-data:/var/lib/feather/data
      - ./configs:/etc/feather:ro
    environment:
      - FEATHER_HTTP_PORT=8080
      - FEATHER_GRPC_PORT=50051
      - FEATHER_PROMETHEUS_PORT=9090
      - FEATHER_HTTP_INGESTION_PORT=8081
      - FEATHER_HOT_MAX_MEMORY=4GB
      - FEATHER_WARM_PATH=/var/lib/feather/data
      - FEATHER_KAFKA_ENABLED=true
      - FEATHER_KAFKA_BROKERS=kafka:9092
      - FEATHER_KAFKA_TOPIC=feature-updates
      - FEATHER_KAFKA_CONSUMER_GROUP=feather
      - FEATHER_LOG_LEVEL=info
    depends_on:
      - kafka
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kafka for streaming ingestion
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9091:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  feather-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  prometheus-data:
  grafana-data:
