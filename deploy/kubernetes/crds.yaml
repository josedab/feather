apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: featurestores.feather.io
  labels:
    app.kubernetes.io/name: feather
    app.kubernetes.io/component: crd
spec:
  group: feather.io
  names:
    kind: FeatureStore
    listKind: FeatureStoreList
    plural: featurestores
    singular: featurestore
    shortNames:
      - fs
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  default: 3
                version:
                  type: string
                image:
                  type: string
                config:
                  type: object
                  properties:
                    httpPort:
                      type: integer
                      default: 8080
                    grpcPort:
                      type: integer
                      default: 50051
                    metricsPort:
                      type: integer
                      default: 9090
                    logLevel:
                      type: string
                      enum: ["debug", "info", "warn", "error"]
                      default: "info"
                resources:
                  type: object
                  properties:
                    cpuRequest:
                      type: string
                    cpuLimit:
                      type: string
                    memoryRequest:
                      type: string
                    memoryLimit:
                      type: string
                storage:
                  type: object
                  properties:
                    hotTier:
                      type: object
                      properties:
                        maxMemory:
                          type: string
                        ttl:
                          type: string
                    warmTier:
                      type: object
                      properties:
                        storageClass:
                          type: string
                        size:
                          type: string
                autoscaling:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    minReplicas:
                      type: integer
                    maxReplicas:
                      type: integer
                    targetCPUUtilization:
                      type: integer
                highAvailability:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    antiAffinity:
                      type: boolean
                    podDisruptionBudget:
                      type: object
                      properties:
                        minAvailable:
                          type: integer
                        maxUnavailable:
                          type: integer
                monitoring:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    serviceMonitor:
                      type: boolean
                    scrapeInterval:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                replicas:
                  type: integer
                readyReplicas:
                  type: integer
                version:
                  type: string
                endpoints:
                  type: object
                  properties:
                    http:
                      type: string
                    grpc:
                      type: string
                    metrics:
                      type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: featuregroups.feather.io
  labels:
    app.kubernetes.io/name: feather
    app.kubernetes.io/component: crd
spec:
  group: feather.io
  names:
    kind: FeatureGroup
    listKind: FeatureGroupList
    plural: featuregroups
    singular: featuregroup
    shortNames:
      - fg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["store", "name", "entity", "features"]
              properties:
                store:
                  type: string
                name:
                  type: string
                description:
                  type: string
                entity:
                  type: string
                owner:
                  type: string
                ttl:
                  type: string
                features:
                  type: array
                  items:
                    type: object
                    required: ["name", "type"]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: ["int64", "float64", "string", "bool", "bytes", "timestamp", "[]int64", "[]float64", "[]string"]
                      description:
                        type: string
                      defaultValue:
                        type: string
                      validation:
                        type: object
                        properties:
                          required:
                            type: boolean
                          min:
                            type: number
                          max:
                            type: number
                          pattern:
                            type: string
                          enum:
                            type: array
                            items:
                              type: string
                tags:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                featureCount:
                  type: integer
                lastUpdated:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Store
          type: string
          jsonPath: .spec.store
        - name: Entity
          type: string
          jsonPath: .spec.entity
        - name: Features
          type: integer
          jsonPath: .status.featureCount
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: featureviews.feather.io
  labels:
    app.kubernetes.io/name: feather
    app.kubernetes.io/component: crd
spec:
  group: feather.io
  names:
    kind: FeatureView
    listKind: FeatureViewList
    plural: featureviews
    singular: featureview
    shortNames:
      - fv
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["store", "name", "sources"]
              properties:
                store:
                  type: string
                name:
                  type: string
                description:
                  type: string
                sources:
                  type: array
                  items:
                    type: object
                    required: ["group"]
                    properties:
                      group:
                        type: string
                      features:
                        type: array
                        items:
                          type: string
                      alias:
                        type: object
                        additionalProperties:
                          type: string
                transformations:
                  type: array
                  items:
                    type: object
                    required: ["name", "type"]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                      expression:
                        type: string
                      config:
                        type: object
                        additionalProperties:
                          type: string
                materialization:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    schedule:
                      type: string
                    mode:
                      type: string
                      enum: ["incremental", "full"]
                    destination:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: ["online", "offline", "both"]
                        onlineStore:
                          type: object
                          properties:
                            ttl:
                              type: string
                        offlineStore:
                          type: object
                          properties:
                            format:
                              type: string
                            path:
                              type: string
                tags:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                lastMaterialization:
                  type: string
                  format: date-time
                nextMaterialization:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Store
          type: string
          jsonPath: .spec.store
        - name: Materialization
          type: boolean
          jsonPath: .spec.materialization.enabled
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Last Run
          type: date
          jsonPath: .status.lastMaterialization
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
