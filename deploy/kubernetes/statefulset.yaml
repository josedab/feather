apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: feather
  namespace: feather-system
  labels:
    app.kubernetes.io/name: feather
    app.kubernetes.io/component: featurestore
spec:
  serviceName: feather-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: feather
  template:
    metadata:
      labels:
        app.kubernetes.io/name: feather
    spec:
      serviceAccountName: feather
      securityContext:
        fsGroup: 1000
      containers:
        - name: feather
          image: feather/feather:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: ingestion
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: feather-config
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: warm-data
              mountPath: /var/lib/feather/data
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: feather
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: feather
  volumeClaimTemplates:
    - metadata:
        name: warm-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
