apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: feather-system

resources:
  - namespace.yaml
  - crds.yaml
  - configmap.yaml
  - secret.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - service.yaml
  - statefulset.yaml
  - pdb.yaml
  # Uncomment to enable ingress
  # - ingress.yaml
  # Uncomment to enable network policies
  # - networkpolicy.yaml

commonLabels:
  app.kubernetes.io/name: feather
  app.kubernetes.io/version: "1.0.0"

