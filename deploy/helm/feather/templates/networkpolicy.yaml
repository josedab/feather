{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "feather.fullname" . }}
  labels:
    {{- include "feather.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "feather.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow health check probes
    - ports:
        - protocol: TCP
          port: {{ .Values.config.httpPort }}
    # Allow gRPC traffic
    - ports:
        - protocol: TCP
          port: {{ .Values.config.grpcPort }}
    # Allow metrics scraping
    - ports:
        - protocol: TCP
          port: {{ .Values.config.metricsPort }}
    # Allow ingestion traffic
    - ports:
        - protocol: TCP
          port: {{ .Values.config.ingestionPort }}
    {{- with .Values.networkPolicy.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow inter-pod communication
    - to:
        - podSelector:
            matchLabels:
              {{- include "feather.selectorLabels" . | nindent 14 }}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
