# Default values for feather.
# This is a YAML-formatted file.

# Replica count for the deployment
replicaCount: 3

image:
  repository: feather/feather
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Feather configuration
config:
  # HTTP server settings
  httpPort: 8080
  # gRPC server settings
  grpcPort: 50051
  # Metrics server settings
  metricsPort: 9090
  # Ingestion server settings
  ingestionPort: 8081
  # Logging configuration
  logLevel: info
  logFormat: json

# Storage configuration
storage:
  # Hot tier (in-memory cache)
  hotTier:
    maxMemory: 4Gi
    ttl: 1h
  # Warm tier (persistent storage)
  warmTier:
    enabled: true
    storageClass: ""
    size: 100Gi
    path: /var/lib/feather/data

# Resource requests and limits
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2
  # maxUnavailable: 1

# Service account configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  fsGroup: 1000

# Container security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Service configuration
service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 50051
  metricsPort: 9090
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: feather.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: feather-tls
  #    hosts:
  #      - feather.local

# Node selector for pod scheduling
nodeSelector: {}

# Tolerations for pod scheduling
tolerations: []

# Affinity rules for pod scheduling
affinity: {}

# High availability configuration
highAvailability:
  enabled: true
  # Enable pod anti-affinity to spread pods across nodes
  antiAffinity: true
  # Topology spread constraints
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone

# Kafka configuration
kafka:
  enabled: false
  brokers: ""
  groupId: feather-consumer
  topics: []
  # SASL authentication
  sasl:
    enabled: false
    mechanism: SCRAM-SHA-256
    username: ""
    passwordSecretRef: ""
  # TLS configuration
  tls:
    enabled: false
    caSecretRef: ""

# Tracing configuration
tracing:
  enabled: false
  endpoint: ""
  sampleRate: 0.1
  insecure: true

# TLS configuration for servers
tls:
  enabled: false
  certSecretRef: ""
  # Auto-generate self-signed certs (for development)
  autoGenerate: false

# Prometheus monitoring
monitoring:
  enabled: true
  # Create ServiceMonitor for Prometheus Operator
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  # Create PrometheusRule for alerting
  prometheusRule:
    enabled: false
    namespace: ""
    labels: {}
    rules: []

# Backup configuration
backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: 7d
  storage:
    type: s3
    bucket: ""
    prefix: feather-backup
    secretRef: ""

# Extra environment variables
extraEnv: []
  # - name: MY_VAR
  #   value: "my-value"

# Extra volume mounts
extraVolumeMounts: []

# Extra volumes
extraVolumes: []

# Init containers
initContainers: []

# Sidecar containers
sidecars: []

# Liveness probe configuration
livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# Readiness probe configuration
readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

# Network policies
networkPolicy:
  enabled: false
  # Ingress rules
  ingress: []
  # Egress rules
  egress: []
