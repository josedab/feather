name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2

  openapi-lint:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install vacuum
        run: |
          curl -fsSL https://quobix.com/scripts/install_vacuum.sh | sh

      - name: Validate OpenAPI spec
        run: |
          vacuum lint -d api/openapi/feather.yaml

  generate-check:
    name: Generated Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Check generated code is up-to-date
        run: make generate-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Environment diagnostics
        run: make doctor || true

      - name: Run short tests (fast feedback)
        run: go test -short -count=1 ./...

      - name: Run full tests with race detector
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check core package coverage threshold
        run: |
          # Extract coverage for core packages and enforce 60% minimum
          COVERAGE=$(go test -short -count=1 -coverprofile=core-coverage.out ./internal/core/... 2>&1 \
            | grep -oP 'coverage: \K[0-9.]+' \
            | awk '{sum+=$1; n++} END {if(n>0) printf "%.1f", sum/n; else print "0"}')
          echo "Core package average coverage: ${COVERAGE}%"
          THRESHOLD=60
          if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
            echo "::error::Core package coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi
          echo "✅ Core coverage ${COVERAGE}% meets ${THRESHOLD}% threshold"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -ldflags "-s -w" -o bin/feather-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/feather

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: feather-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/feather-*
          retention-days: 7

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and smoke test
        run: |
          go build -o bin/feather ./cmd/feather
          bin/feather &
          SERVER_PID=$!
          # Wait for server to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 1
          done
          # Run full API smoke tests
          ./scripts/smoke-test.sh
          RESULT=$?
          kill $SERVER_PID || true
          exit $RESULT

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-integration'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: make test-integration

  python-sdk:
    name: Python SDK Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.changed_files, 'sdk/python') || !contains(github.event.pull_request.labels.*.name, 'skip-sdk')))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and test Python SDK
        working-directory: sdk/python
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          python -m pytest tests/ -v --tb=short

  typescript-sdk:
    name: TypeScript SDK Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.changed_files, 'sdk/typescript') || !contains(github.event.pull_request.labels.*.name, 'skip-sdk')))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/typescript/package.json

      - name: Install and test TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm test
