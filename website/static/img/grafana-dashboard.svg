<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f1f1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#73BF69;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#56A64B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5794F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3274D9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9830;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E55400;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dashboard Background -->
  <rect width="900" height="500" fill="#0b0c0e"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="40" fill="#181b1f"/>
  <text x="20" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#d8d9da">Feather Feature Store Dashboard</text>
  <text x="780" y="26" font-family="system-ui, sans-serif" font-size="12" fill="#8e8e8e">Last 6 hours</text>

  <!-- Row 1: Overview Metrics -->
  <!-- Panel 1: Request Rate -->
  <g transform="translate(10, 50)">
    <rect width="215" height="130" rx="4" fill="url(#panelGrad)" stroke="#2c2f33" stroke-width="1"/>
    <text x="10" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#8e8e8e">Request Rate</text>
    <text x="10" y="70" font-family="system-ui, sans-serif" font-size="32" font-weight="600" fill="#73BF69">45.2K</text>
    <text x="10" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#8e8e8e">req/sec</text>
    <!-- Mini sparkline -->
    <polyline points="10,115 40,110 70,108 100,112 130,105 160,103 190,100" stroke="#73BF69" stroke-width="2" fill="none"/>
    <circle cx="190" cy="100" r="3" fill="#73BF69"/>
  </g>

  <!-- Panel 2: P99 Latency -->
  <g transform="translate(235, 50)">
    <rect width="215" height="130" rx="4" fill="url(#panelGrad)" stroke="#2c2f33" stroke-width="1"/>
    <text x="10" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#8e8e8e">P99 Latency</text>
    <text x="10" y="70" font-family="system-ui, sans-serif" font-size="32" font-weight="600" fill="#5794F2">0.82ms</text>
    <text x="10" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#8e8e8e">milliseconds</text>
    <!-- Mini sparkline -->
    <polyline points="10,115 40,112 70,115 100,110 130,108 160,113 190,110" stroke="#5794F2" stroke-width="2" fill="none"/>
    <circle cx="190" cy="110" r="3" fill="#5794F2"/>
  </g>

  <!-- Panel 3: Cache Hit Rate -->
  <g transform="translate(460, 50)">
    <rect width="215" height="130" rx="4" fill="url(#panelGrad)" stroke="#2c2f33" stroke-width="1"/>
    <text x="10" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#8e8e8e">Cache Hit Rate</text>
    <text x="10" y="70" font-family="system-ui, sans-serif" font-size="32" font-weight="600" fill="#73BF69">94.2%</text>
    <text x="10" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#8e8e8e">hot tier hits</text>
    <!-- Mini gauge -->
    <rect x="10" y="105" width="190" height="10" rx="5" fill="#2c2f33"/>
    <rect x="10" y="105" width="179" height="10" rx="5" fill="#73BF69"/>
  </g>

  <!-- Panel 4: Error Rate -->
  <g transform="translate(685, 50)">
    <rect width="205" height="130" rx="4" fill="url(#panelGrad)" stroke="#2c2f33" stroke-width="1"/>
    <text x="10" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#8e8e8e">Error Rate</text>
    <text x="10" y="70" font-family="system-ui, sans-serif" font-size="32" font-weight="600" fill="#73BF69">0.02%</text>
    <text x="10" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#8e8e8e">5xx responses</text>
    <!-- Mini sparkline flat -->
    <polyline points="10,115 40,114 70,115 100,114 130,115 160,114 180,115" stroke="#73BF69" stroke-width="2" fill="none"/>
    <circle cx="180" cy="115" r="3" fill="#73BF69"/>
  </g>

  <!-- Row 2: Request Latency Distribution -->
  <g transform="translate(10, 190)">
    <rect width="440" height="150" rx="4" fill="url(#panelGrad)" stroke="#2c2f33" stroke-width="1"/>
    <text x="10" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#8e8e8e">HTTP Request Latency</text>

    <!-- Grid lines -->
    <line x1="40" y1="45" x2="420" y2="45" stroke="#2c2f33" stroke-width="1"/>
    <line x1="40" y1="70" x2="420" y2="70" stroke="#2c2f33" stroke-width="1"/>
    <line x1="40" y1="95" x2="420" y2="95" stroke="#2c2f33" stroke-width="1"/>
    <line x1="40" y1="120" x2="420" y2="120" stroke="#2c2f33" stroke-width="1"/>

    <!-- Y-axis labels -->
    <text x="8" y="48" font-family="system-ui, sans-serif" font-size="9" fill="#6e6e6e">2ms</text>
    <text x="8" y="73" font-family="system-ui, sans-serif" font-size="9" fill="#6e6e6e">1.5ms</text>
    <text x="8" y="98" font-family="system-ui, sans-serif" font-size="9" fill="#6e6e6e">1ms</text>
    <text x="8" y="123" font-family="system-ui, sans-serif" font-size="9" fill="#6e6e6e">0.5ms</text>

    <!-- P99 Line (orange) -->
    <polyline points="40,80 80,85 120,78 160,82 200,75 240,80 280,77 320,83 360,79 400,76" stroke="#FF9830" stroke-width="2" fill="none"/>

    <!-- P50 Line (green) -->
    <polyline points="40,115 80,118 120,112 160,116 200,110 240,114 280,111 320,117 360,113 400,110" stroke="#73BF69" stroke-width="2" fill="none"/>

    <!-- Legend -->
    <rect x="320" y="130" width="12" height="3" fill="#FF9830"/>
    <text x="336" y="134" font-family="system-ui, sans-serif" font-size="9" fill="#8e8e8e">P99</text>
    <rect x="370" y="130" width="12" height="3" fill="#73BF69"/>
    <text x="386" y="134" font-family="system-ui, sans-serif" font-size="9" fill="#8e8e8e">P50</text>
  </g>

  <!-- Row 2: Storage Usage -->
  <g transform="translate(460, 190)">
    <rect width="430" height="150" rx="4" fill="url(#panelGrad)" stroke="#2c2f33" stroke-width="1"/>
    <text x="10" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#8e8e8e">Storage Tier Usage</text>

    <!-- Hot tier bar -->
    <text x="10" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#8e8e8e">Hot Tier (Memory)</text>
    <rect x="10" y="60" width="400" height="20" rx="3" fill="#2c2f33"/>
    <rect x="10" y="60" width="260" height="20" rx="3" fill="#5794F2"/>
    <text x="280" y="75" font-family="system-ui, sans-serif" font-size="10" fill="white">6.5 GB / 10 GB (65%)</text>

    <!-- Warm tier bar -->
    <text x="10" y="105" font-family="system-ui, sans-serif" font-size="10" fill="#8e8e8e">Warm Tier (Disk)</text>
    <rect x="10" y="110" width="400" height="20" rx="3" fill="#2c2f33"/>
    <rect x="10" y="110" width="180" height="20" rx="3" fill="#73BF69"/>
    <text x="200" y="125" font-family="system-ui, sans-serif" font-size="10" fill="white">45 GB / 100 GB (45%)</text>
  </g>

  <!-- Row 3: Request Volume Graph -->
  <g transform="translate(10, 350)">
    <rect width="880" height="140" rx="4" fill="url(#panelGrad)" stroke="#2c2f33" stroke-width="1"/>
    <text x="10" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#8e8e8e">Request Volume (6 hours)</text>

    <!-- Grid lines -->
    <line x1="50" y1="45" x2="860" y2="45" stroke="#2c2f33" stroke-width="1"/>
    <line x1="50" y1="65" x2="860" y2="65" stroke="#2c2f33" stroke-width="1"/>
    <line x1="50" y1="85" x2="860" y2="85" stroke="#2c2f33" stroke-width="1"/>
    <line x1="50" y1="105" x2="860" y2="105" stroke="#2c2f33" stroke-width="1"/>

    <!-- Y-axis labels -->
    <text x="10" y="48" font-family="system-ui, sans-serif" font-size="9" fill="#6e6e6e">60K</text>
    <text x="10" y="68" font-family="system-ui, sans-serif" font-size="9" fill="#6e6e6e">45K</text>
    <text x="10" y="88" font-family="system-ui, sans-serif" font-size="9" fill="#6e6e6e">30K</text>
    <text x="10" y="108" font-family="system-ui, sans-serif" font-size="9" fill="#6e6e6e">15K</text>

    <!-- Area fill -->
    <polygon points="50,120 100,95 150,90 200,85 250,75 300,70 350,72 400,65 450,60 500,55 550,58 600,52 650,55 700,50 750,48 800,52 850,48 850,120" fill="rgba(115,191,105,0.2)"/>

    <!-- Line graph -->
    <polyline points="50,95 100,90 150,85 200,80 250,70 300,65 350,68 400,60 450,55 500,50 550,53 600,47 650,50 700,45 750,43 800,47 850,43" stroke="#73BF69" stroke-width="2" fill="none"/>

    <!-- X-axis time labels -->
    <text x="50" y="132" font-family="system-ui, sans-serif" font-size="9" fill="#6e6e6e">6h ago</text>
    <text x="250" y="132" font-family="system-ui, sans-serif" font-size="9" fill="#6e6e6e">4h ago</text>
    <text x="450" y="132" font-family="system-ui, sans-serif" font-size="9" fill="#6e6e6e">2h ago</text>
    <text x="650" y="132" font-family="system-ui, sans-serif" font-size="9" fill="#6e6e6e">1h ago</text>
    <text x="830" y="132" font-family="system-ui, sans-serif" font-size="9" fill="#6e6e6e">now</text>
  </g>
</svg>
