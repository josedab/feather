<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Pattern overlay -->
  <g opacity="0.05">
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="2" fill="white"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- Feather logo -->
  <g transform="translate(100, 180)">
    <circle cx="80" cy="80" r="75" fill="rgba(255,255,255,0.15)" />
    <g transform="translate(30, 25) scale(1)">
      <path d="M50 10 C45 25, 35 40, 30 60 C25 80, 30 95, 45 105 C55 95, 60 80, 58 60 C56 40, 52 25, 50 10 Z"
            fill="url(#featherGrad)" opacity="0.95"/>
      <path d="M45 105 L50 125 L55 105" fill="url(#featherGrad)" opacity="0.95"/>
      <path d="M50 15 L30 55" stroke="rgba(76,175,80,0.3)" stroke-width="1.5" fill="none"/>
      <path d="M50 25 L35 60" stroke="rgba(76,175,80,0.3)" stroke-width="1.5" fill="none"/>
      <path d="M50 35 L38 70" stroke="rgba(76,175,80,0.3)" stroke-width="1.5" fill="none"/>
      <path d="M50 15 L58 50" stroke="rgba(76,175,80,0.3)" stroke-width="1.5" fill="none"/>
      <path d="M50 25 L57 55" stroke="rgba(76,175,80,0.3)" stroke-width="1.5" fill="none"/>
    </g>
  </g>

  <!-- Title -->
  <text x="300" y="230" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="700" fill="white">
    Feather
  </text>

  <!-- Tagline -->
  <text x="300" y="290" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.9)">
    High-Performance Real-Time Feature Store
  </text>

  <!-- Key features -->
  <g transform="translate(300, 340)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="rgba(255,255,255,0.85)">
    <g transform="translate(0, 0)">
      <rect x="0" y="-18" width="180" height="32" rx="16" fill="rgba(255,255,255,0.15)"/>
      <text x="90" y="6" text-anchor="middle">Sub-ms Latency</text>
    </g>
    <g transform="translate(200, 0)">
      <rect x="0" y="-18" width="180" height="32" rx="16" fill="rgba(255,255,255,0.15)"/>
      <text x="90" y="6" text-anchor="middle">Single Binary</text>
    </g>
    <g transform="translate(400, 0)">
      <rect x="0" y="-18" width="180" height="32" rx="16" fill="rgba(255,255,255,0.15)"/>
      <text x="90" y="6" text-anchor="middle">Vector Search</text>
    </g>
  </g>

  <!-- Stats bar -->
  <g transform="translate(300, 420)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="0" y="0" font-size="42" font-weight="700" fill="white">&lt;1ms</text>
    <text x="0" y="30" font-size="16" fill="rgba(255,255,255,0.7)">P99 Latency</text>

    <text x="180" y="0" font-size="42" font-weight="700" fill="white">1M+</text>
    <text x="180" y="30" font-size="16" fill="rgba(255,255,255,0.7)">Ops/Second</text>

    <text x="340" y="0" font-size="42" font-weight="700" fill="white">Go</text>
    <text x="340" y="30" font-size="16" fill="rgba(255,255,255,0.7)">Language</text>
  </g>

  <!-- Bottom tagline -->
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)">
    feather-store.github.io
  </text>

  <!-- Decorative elements -->
  <circle cx="1050" cy="150" r="120" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1100" cy="500" r="80" fill="rgba(255,255,255,0.05)"/>
  <circle cx="950" cy="350" r="40" fill="rgba(255,255,255,0.03)"/>
</svg>
