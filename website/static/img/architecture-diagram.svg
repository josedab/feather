<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="hotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5722;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#03A9F4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8BC34A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E91E63;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>

  <!-- Client Applications -->
  <g transform="translate(250, 30)" filter="url(#shadow)">
    <rect width="300" height="60" rx="8" fill="url(#clientGrad)"/>
    <text x="150" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">Client Applications</text>
    <text x="150" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">ML Models, Training Pipelines, Services</text>
  </g>

  <!-- Arrow from Clients to Servers -->
  <path d="M400 95 L400 130" stroke="#9CA3AF" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- HTTP and gRPC Servers -->
  <g transform="translate(150, 140)" filter="url(#shadow)">
    <rect width="140" height="50" rx="6" fill="url(#serverGrad)"/>
    <text x="70" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white">HTTP :8080</text>
    <text x="70" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">REST API</text>
  </g>

  <g transform="translate(510, 140)" filter="url(#shadow)">
    <rect width="140" height="50" rx="6" fill="url(#serverGrad)"/>
    <text x="70" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white">gRPC :50051</text>
    <text x="70" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)">Streaming</text>
  </g>

  <!-- Arrows from servers to engine -->
  <path d="M220 195 L340 230" stroke="#9CA3AF" stroke-width="2" fill="none"/>
  <path d="M580 195 L460 230" stroke="#9CA3AF" stroke-width="2" fill="none"/>

  <!-- Feature Engine -->
  <g transform="translate(250, 230)" filter="url(#shadow)">
    <rect width="300" height="80" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>
    <text x="150" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1F2937">Feature Engine</text>
    <line x1="20" y1="38" x2="280" y2="38" stroke="#E5E7EB" stroke-width="1"/>
    <text x="70" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">Schema Registry</text>
    <text x="150" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">Aggregations</text>
    <text x="230" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">Rate Limiting</text>
  </g>

  <!-- Arrows from engine to storage -->
  <path d="M340 315 L260 360" stroke="#9CA3AF" stroke-width="2" fill="none"/>
  <path d="M460 315 L540 360" stroke="#9CA3AF" stroke-width="2" fill="none"/>

  <!-- Hot Tier -->
  <g transform="translate(100, 360)" filter="url(#shadow)">
    <rect width="200" height="100" rx="8" fill="url(#hotGrad)"/>
    <text x="100" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">Hot Tier</text>
    <text x="100" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">In-Memory LRU Cache</text>
    <line x1="20" y1="60" x2="180" y2="60" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="100" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white">&lt;1ms</text>
    <text x="100" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">256 shards</text>
  </g>

  <!-- Warm Tier -->
  <g transform="translate(500, 360)" filter="url(#shadow)">
    <rect width="200" height="100" rx="8" fill="url(#warmGrad)"/>
    <text x="100" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">Warm Tier</text>
    <text x="100" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">BadgerDB Persistent</text>
    <line x1="20" y1="60" x2="180" y2="60" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="100" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white">1-10ms</text>
    <text x="100" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)">+ historical versions</text>
  </g>

  <!-- Bidirectional arrow between tiers -->
  <g transform="translate(305, 410)">
    <line x1="0" y1="0" x2="190" y2="0" stroke="#9CA3AF" stroke-width="2"/>
    <polygon points="0,0 8,-4 8,4" fill="#9CA3AF"/>
    <polygon points="190,0 182,-4 182,4" fill="#9CA3AF"/>
    <text x="95" y="-8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#6B7280">overflow</text>
  </g>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9CA3AF"/>
    </marker>
  </defs>
</svg>
