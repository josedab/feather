<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="featherGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Subtle outer glow for dark backgrounds -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="rgba(102,187,106,0.3)" stroke-width="2"/>

  <!-- Background circle with brighter gradient -->
  <circle cx="60" cy="60" r="55" fill="url(#featherGradDark)" filter="url(#glow)"/>

  <!-- Feather shape -->
  <g transform="translate(25, 20) scale(0.7)">
    <!-- Main feather body -->
    <path d="M50 10 C45 25, 35 40, 30 60 C25 80, 30 95, 45 105 C55 95, 60 80, 58 60 C56 40, 52 25, 50 10 Z"
          fill="white" opacity="1"/>

    <!-- Feather quill -->
    <path d="M45 105 L50 130 L55 105" fill="white" opacity="1"/>

    <!-- Feather veins - slightly more visible on dark mode -->
    <path d="M50 15 L30 55" stroke="rgba(0,0,0,0.15)" stroke-width="1" fill="none"/>
    <path d="M50 25 L35 60" stroke="rgba(0,0,0,0.15)" stroke-width="1" fill="none"/>
    <path d="M50 35 L38 70" stroke="rgba(0,0,0,0.15)" stroke-width="1" fill="none"/>
    <path d="M50 15 L58 50" stroke="rgba(0,0,0,0.15)" stroke-width="1" fill="none"/>
    <path d="M50 25 L57 55" stroke="rgba(0,0,0,0.15)" stroke-width="1" fill="none"/>
    <path d="M50 35 L55 65" stroke="rgba(0,0,0,0.15)" stroke-width="1" fill="none"/>
  </g>
</svg>
