# golangci-lint configuration for Feather
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended linters
    - bodyclose      # Check HTTP response body is closed
    - contextcheck   # Check context.Context is passed correctly
    - durationcheck  # Check time.Duration multiplication
    - errname        # Check error naming conventions
    - errorlint      # Find issues with error wrapping
    - exhaustive     # Check switch exhaustiveness
    - copyloopvar    # Check loop variable capture
    - gofmt          # Check formatting
    - goimports      # Check imports ordering
    - gosec          # Security checks
    - misspell       # Check spelling
    - nilerr         # Check nil error returns
    - noctx          # Check HTTP requests use context
    - prealloc       # Suggest preallocations
    - predeclared    # Check shadowing of predeclared identifiers
    - revive         # Replacement for golint
    - unconvert      # Remove unnecessary conversions
    - wastedassign   # Find wasted assignments

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false

  govet:
    enable-all: true
    disable:
      - fieldalignment  # Too noisy for most codebases

  gosec:
    excludes:
      - G104  # Unhandled errors (covered by errcheck)
      - G304  # File path from variable (intentional in config loading)

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code

  exhaustive:
    default-signifies-exhaustive: true

  misspell:
    locale: US

  goimports:
    local-prefixes: github.com/feather-store/feather

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # Ignore long lines in generated files
    - path: ".*\\.pb\\.go"
      linters:
        - all

    # Test files can have longer functions and magic numbers
    - path: "_test\\.go"
      linters:
        - gosec
        - errcheck

    # Allow context.Background() in main and tests
    - path: "cmd/.*\\.go"
      linters:
        - noctx
    - path: "internal/integrations/warehouse/scheduler.go"
      linters:
        - contextcheck

    # Allow dot imports in tests for testify
    - path: "_test\\.go"
      text: "dot-imports"
      linters:
        - revive

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
